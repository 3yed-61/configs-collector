name: Daily Sub Classify — Artifact + Commit (Iran TZ)

on:
  schedule:
    # Runs daily at 00:00 Iran time (IRST = UTC+3:30)
    # Converted to UTC: 20:30 previous day
    - cron: '30 20 * * *'
  workflow_dispatch:

concurrency:
  group: sub-classify-daily
  cancel-in-progress: false

jobs:
  classify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    env:
      TZ: Asia/Tehran

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run sub classifier
        run: |
          echo "Running classifier at $(date)"
          python sub_classifier.py \
            --outdir ./classified_output \
            --decode-vmess \
            --verbose

      - name: Verify output integrity
        run: |
          if [ ! -f classified_output/vless.txt ]; then
            echo "ERROR: classified_output/vless.txt not found"
            ls -la classified_output || true
            exit 1
          fi

      - name: Upload classified_output artifact
        uses: actions/upload-artifact@v4
        with:
          name: classified_output
          path: classified_output
          retention-days: 7
          if-no-files-found: error

      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add classified_output

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily classified update (Iran TZ) [skip ci]"
            git push
          fi
