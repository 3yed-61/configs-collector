[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "configs-collector"
version = "2.0.0"
description = "Automated V2Ray config collector, validator, and classifier"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "3yed-61"},
]
keywords = ["v2ray", "proxy", "config", "collector", "classifier"]

dependencies = [
    "requests>=2.31.0,<3.0.0",
    "urllib3>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
configs-collector = "collector.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
